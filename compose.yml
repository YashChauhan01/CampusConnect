services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_dev_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusconnect"]
      interval: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025"]

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/campusconnect
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:-campus_dev_only}
      SMTP_HOST: mailpit
      MAIL_MODE: ${MAIL_MODE:-smtp}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APPROVED_DOMAINS: ${APPROVED_DOMAINS:-college.edu}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      FORWARD_HEADERS_STRATEGY: native
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3.1}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-deployment-64-characters-minimum-12345}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}

  # nginx serves the built app and proxies /api and /ws to the backend (same origin, no CORS).
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
