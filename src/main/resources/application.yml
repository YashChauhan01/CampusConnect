server:
  port: 8080
  # Set to "native" when running behind a reverse proxy so rate limiting sees real client addresses.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful

spring:
  application:
    name: campusconnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusconnect}
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Required, at least 32 characters. Generate with: openssl rand -base64 48
  jwt-secret: ${JWT_SECRET}
  secure-cookies: ${SECURE_COOKIES:false}
  # Comma separated list of college email domains that may register.
  approved-domains: ${APPROVED_DOMAINS:college.edu}
  verification-minutes: ${VERIFICATION_MINUTES:30}
  reset-minutes: ${RESET_MINUTES:30}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
  presence-minutes: ${PRESENCE_MINUTES:15}
  bcrypt-strength: ${BCRYPT_STRENGTH:12}
  mail:
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:noreply@campusconnect.local}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    edu.campusconnect: INFO
