
server:
  port: 8080

spring:
  application:
    name: campusconnect

  # PostgreSQL Database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusconnect}
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus_dev_only}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Email Verification (Mailpit)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# CampusConnect Application Configuration
app:

  # React Frontend
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  # JWT Authentication
  jwt-secret: ${JWT_SECRET}

  # Cookies
  secure-cookies: ${SECURE_COOKIES:false}

  # College Email Verification
  approved-domains: ${APPROVED_DOMAINS:example.edu, gmail.com, yahoo.com}
  verification-minutes: ${VERIFICATION_MINUTES:30}

  # Campus Presence
  presence-minutes: ${PRESENCE_MINUTES:15}

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    root: INFO
    edu.campusconnect: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

